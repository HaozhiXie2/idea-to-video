name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned local render dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
      - name: Python offline tests (no cloud credentials)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend offline tests
        run: node tests/test_ui.cjs
      - name: Check source and documentation hygiene
        run: python scripts/check-repo.py
      - name: Parse Windows launchers without executing them
        shell: powershell
        run: |
          $syntaxFailed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              $syntaxFailed = $true
            }
          }
          if ($syntaxFailed) { exit 1 }
